<div class="container mt-4">

  <!-- Search with icon -->
  <div class="input-group mb-4 shadow">
    <span class="input-group-text bg-white border-end-0">
      <i class="bi bi-search">🔍</i>
    </span>
    <!-- reactive form -->
    <input    
      type="text"
      class="form-control border-start-0"
      placeholder="Search delicious recipes..."
      [formControl]="searchControl"       
    />
  </div>

  <!-- Loading indicator -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="alert alert-danger" role="alert">
    Failed to load recipes. Please try again later.
  </div>

  <!-- results -->
  <app-recipe-grid *ngIf="!loading && !error" [recipes]="recipes"></app-recipe-grid>     <!-- byb3at el data elly gabha mn api lel recipe grid component 3ashan ye3rdha -->

  <!-- No results message -->
  <div *ngIf="!loading && !error && recipes.length === 0 && initialLoadDone" class="text-center py-5">
    <p class="text-muted">No recipes found. Try a different search term.</p>
  </div>

</div>
