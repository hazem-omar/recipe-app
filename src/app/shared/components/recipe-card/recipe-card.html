<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden" (click)="openDetails()">

  <div class="position-relative">
    <img
      [src]="recipe.image"
      class="card-img-top"
      style="height: 180px; object-fit: cover;"
      loading="lazy"
    />
    <div class="position-absolute top-0 end-0 p-2">
      <!-- stopPropagation 3ashan lama ados 3ala el heart myfta7sh el dialog -->
      <button
        class="btn btn-sm rounded-circle"
        [class.btn-danger]="isFavorite"
        [class.btn-light]="!isFavorite"
        (click)="toggleFavorite(); $event.stopPropagation()"      
      >
        ❤️
      </button>
    </div>
  </div>

  <div class="card-body d-flex flex-column justify-content-between">

    <h6 class="card-title text-truncate">{{ recipe.title }}</h6>

    <div class="d-flex align-items-center text-muted small">
      <span class="me-3">⏱ {{ recipe.readyInMinutes }} mins</span>
    </div>

  </div>

</div>
