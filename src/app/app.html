<div class="container-fluid">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm border-bottom">
    <div class="container-fluid">
      <a routerLink="/" class="navbar-brand fw-bold text-success">
        🍳 Recipe App
      </a>
      <div class="d-flex align-items-center gap-3">
        <a routerLink="/" routerLinkActive="text-danger" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          🔍 Search
        </a>
        <a routerLink="/favorites" routerLinkActive="text-danger" class="nav-link">
          ❤️ Favorites
        </a>
      </div>
    </div>
  </nav>

  <div class="row g-0">

    <!-- MAIN -->
    <div [@routeAnimations]="prepareRoute(outlet)" class="col-lg-9 col-md-8 col-12 p-3">
      <router-outlet #outlet="outlet"></router-outlet>
    </div>

    <!-- SIDEBAR -->
    <div class="col-lg-3 col-md-4 d-none d-md-block border-start bg-light vh-100 position-sticky top-0 p-3">

      <app-shopping-list-drawer></app-shopping-list-drawer>

    </div>

  </div>

</div>
